name: vigia-build

# Rama «vigia» del Vigía del terreno: sólo el binario Linux x86_64 (el VPS agentes-1 es Ubuntu 24.04 amd64).
# El flujo original de Neolink (Windows, macOS, cross, Docker) está en upstream; aquí sobra y los runners
# macos-12 ya no existen.
on:
  push:
    branches: [vigia]
  workflow_dispatch:

jobs:
  linux:
    name: linux-x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: apt install gstreamer
        run: |
          sudo apt update
          sudo apt install -y libgstrtspserver-1.0-dev libgstreamer1.0-dev libgtk2.0-dev protobuf-compiler libssl-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build
        run: |
          rustc --version
          export JEMALLOC_SYS_WITH_LG_PAGE=16
          cargo build --release --all-features
          ./target/release/neolink --version
      - uses: actions/upload-artifact@v4
        with:
          name: neolink-linux-x86_64
          path: target/release/neolink
